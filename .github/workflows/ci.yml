name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Python packages
        run: python -m pip install -r scripts/requirements.txt
      - run: npm ci
      - run: npm run build
      - name: TypeScript tests
        run: npm test
      - name: Python tests
        working-directory: python
        run: python -W ignore -m unittest

  package:
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac dmg zip --arm64 --x64
            app: release/mac-arm64/EvoScholar.app/Contents/MacOS/EvoScholar
            artifact: release/*.dmg
          - os: windows-latest
            target: --win nsis --x64
            app: release/win-unpacked/EvoScholar.exe
            artifact: release/*.exe
    env:
      SIGN_MAC: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-latest' && secrets.MAC_CERTS_BASE64 != '' && secrets.MAC_CERTS_PASSWORD != '' }}
      NOTARIZE_MAC: ${{ github.event_name != 'pull_request' && matrix.os == 'macos-latest' && secrets.MAC_CERTS_BASE64 != '' && secrets.MAC_CERTS_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      SIGN_WIN: ${{ github.event_name != 'pull_request' && matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # electron-builder treats a defined but empty CSC_LINK as a certificate path and fails outside pull requests,
      # so signing variables are exported only when the matching Secrets exist; otherwise none are set.
      - name: Configure code signing
        shell: bash
        env:
          MAC_CERTS_BASE64: ${{ env.SIGN_MAC == 'true' && secrets.MAC_CERTS_BASE64 || '' }}
          MAC_CERTS_PASSWORD: ${{ env.SIGN_MAC == 'true' && secrets.MAC_CERTS_PASSWORD || '' }}
          NOTARY_APPLE_ID: ${{ env.NOTARIZE_MAC == 'true' && secrets.APPLE_ID || '' }}
          NOTARY_PASSWORD: ${{ env.NOTARIZE_MAC == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          NOTARY_TEAM_ID: ${{ env.NOTARIZE_MAC == 'true' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CERT: ${{ env.SIGN_WIN == 'true' && secrets.WIN_CSC_LINK || '' }}
          WIN_CERT_PASSWORD: ${{ env.SIGN_WIN == 'true' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          put() { { echo "$1<<EVO_ENV_EOF"; echo "$2"; echo "EVO_ENV_EOF"; } >> "$GITHUB_ENV"; }
          if [[ "$SIGN_MAC" == true ]]; then
            put CSC_IDENTITY_AUTO_DISCOVERY true
            put CSC_LINK "$MAC_CERTS_BASE64"
            put CSC_KEY_PASSWORD "$MAC_CERTS_PASSWORD"
            if [[ "$NOTARIZE_MAC" == true ]]; then
              put APPLE_ID "$NOTARY_APPLE_ID"
              put APPLE_APP_SPECIFIC_PASSWORD "$NOTARY_PASSWORD"
              put APPLE_TEAM_ID "$NOTARY_TEAM_ID"
            fi
          elif [[ "$SIGN_WIN" == true ]]; then
            put WIN_CSC_LINK "$WIN_CERT"
            put WIN_CSC_KEY_PASSWORD "$WIN_CERT_PASSWORD"
          else
            put CSC_IDENTITY_AUTO_DISCOVERY false
          fi
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Smoke test the packaged app
        run: node scripts/app-smoke.mjs ${{ matrix.app }}
      - name: Verify macOS signatures and notarization
        if: env.SIGN_MAC == 'true'
        run: node scripts/verify-signatures.mjs --strict release/mac-arm64/EvoScholar.app release/mac/EvoScholar.app
      - name: Verify Windows signatures
        if: env.SIGN_WIN == 'true'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/verify-signatures.mjs --strict release/win-unpacked/EvoScholar.exe "release/EvoScholar-Setup-$version.exe"
      - name: Report unsigned build
        if: env.SIGN_MAC != 'true' && env.SIGN_WIN != 'true'
        run: node scripts/verify-signatures.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            ${{ matrix.artifact }}
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match package.json version v$version"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Upload installers to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in "EvoScholar-$RELEASE_VERSION-arm64.dmg" "EvoScholar-$RELEASE_VERSION-x64.dmg" \
            "EvoScholar-$RELEASE_VERSION-arm64.zip" "EvoScholar-$RELEASE_VERSION-x64.zip" \
            "EvoScholar-Setup-$RELEASE_VERSION.exe" latest-mac.yml latest.yml; do
            test -f "release-assets/$file" || { echo "Missing release asset: $file"; exit 1; }
          done
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "Release $GITHUB_REF_NAME has already been published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag --title "EvoScholar $GITHUB_REF_NAME"
          fi
