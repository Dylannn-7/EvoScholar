<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvoScholar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<!-- Liquid-glass refraction (Chromium applies it through backdrop-filter; other browsers keep the plain blur) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="ui">
  <header class="brand" id="backHome" title="回到首页" role="button" tabindex="0">
    <div class="orb glass lens" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="18" height="18">
        <polygon fill="#fff" points="20,6 22.6,14.6 30.9,11.2 25.9,18.6 33.4,23.4 24.6,23.6 25.9,32.4 20,25.8 14.1,32.4 15.4,23.6 6.6,23.4 14.1,18.6 9.1,11.2 17.4,14.6"/>
      </svg>
    </div>
    <div><div class="name">EvoScholar</div><div class="sub">RESEARCH WORKBENCH</div></div>
  </header>

  <div class="corner">
    <button class="counter orb glass lens" id="counter" title="当前 harness genome（点击查看进化）">00</button>
    <button class="orb glass lens gear" id="settingsBtn" title="设置" aria-label="设置">
      <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M10 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M16.2 11.9l1.3 1-1.6 2.8-1.6-.6a6 6 0 0 1-1.7 1l-.3 1.6H9l-.3-1.6a6 6 0 0 1-1.7-1l-1.6.6-1.6-2.8 1.3-1a6 6 0 0 1 0-1.9l-1.3-1 1.6-2.8 1.6.6a6 6 0 0 1 1.7-1L9 2.2h3.2l.3 1.6a6 6 0 0 1 1.7 1l1.6-.6 1.6 2.8-1.3 1a6 6 0 0 1 0 1.9Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <nav class="tags glass seg" id="tags" aria-label="会话筛选">
    <button class="chip on" data-mode="all">全部</button>
    <button class="chip" data-mode="literature">文献</button>
    <button class="chip" data-mode="data">数据</button>
    <button class="chip" data-mode="figure">出图</button>
    <button class="chip" data-mode="writing">写作</button>
    <button class="chip" data-mode="chat">对话</button>
  </nav>

  <aside class="list" id="sessions" aria-label="会话"></aside>

  <main class="center" id="center">
    <header class="top">
      <div class="top-text">
        <h1 id="title"></h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <button class="icon-btn" data-panel="files" title="会话文件" aria-label="会话文件">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 4.5a1 1 0 0 1 1-1h3l1.4 1.5h4.6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <section class="thread" id="thread"></section>
    <form class="composer glass" id="composer">
      <div class="attachments" id="attachments"></div>
      <textarea id="input" rows="1" placeholder="问点什么……可以粘贴图片，或上传数据文件"></textarea>
      <div class="composer-bar">
        <label class="tb-btn file-btn" title="上传文件到 inputs/" aria-label="上传文件">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="file" id="fileInput" multiple hidden>
        </label>
        <button type="button" class="tb-btn model" id="modelChip" title="模型与密钥"><span id="modelName">—</span>
          <svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="hint" id="cwdHint"></span>
        <button type="button" class="stop" id="stopBtn" title="停止" aria-label="停止" hidden><i></i></button>
        <button type="submit" class="send" id="sendBtn" title="发送（Enter）" aria-label="发送">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </form>
    <div class="suggest" id="suggest"></div>
  </main>

  <aside class="panel glass sheet" id="panel" hidden>
    <div class="panel-head">
      <nav class="ptabs" id="ptabs">
        <button data-panel="overview">概览</button>
        <button data-panel="evolution" id="evoBtn">进化</button>
        <button data-panel="settings">模型与密钥</button>
        <button data-panel="files">文件</button>
        <button data-panel="ledger">账单</button>
      </nav>
      <button class="close" id="closePanel" title="关闭" aria-label="关闭"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <h2 id="panelTitle"></h2>
    <div id="panelBody"></div>
  </aside>
</div>
<template id="tplApproval">
  <div class="approval">
    <div class="approval-head">需要你的确认 · <b class="tool"></b></div>
    <pre class="summary"></pre>
    <div class="approval-actions"><button class="pill deny">拒绝</button><button class="primary allow">允许执行</button></div>
  </div>
</template>
<script type="module" src="/app.js"></script>
</body>
</html>
