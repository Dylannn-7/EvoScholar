<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvoScholar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <nav class="rail glass" id="rail" aria-label="主导航"></nav>

  <aside class="side glass" id="side" aria-label="项目与会话" hidden>
    <div class="side-head">
      <div class="title">EvoScholar</div>
      <button class="icon-btn" id="addProject" data-tip="添加项目文件夹" type="button"></button>
    </div>
    <button class="new-chat" id="newChat" type="button"></button>
    <div class="tree" id="tree"></div>
  </aside>

  <main class="main" id="main">
    <section class="view" id="view-workbench">
      <div class="conv" id="conv">
        <header class="conv-head" id="convHead"></header>
        <div class="banner" id="banner" hidden></div>
        <section class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></section>
        <form class="composer glass dark" id="composer" autocomplete="off">
          <div class="chips" id="chips"></div>
          <textarea id="input" rows="1" placeholder="输入任务，@ 引用文件"></textarea>
          <div class="cbar" id="cbar"></div>
          <input type="file" id="fileInput" multiple hidden>
        </form>
      </div>
    </section>
    <section class="view" id="view-trajectory" hidden></section>
    <section class="view" id="view-plugins" hidden></section>
    <section class="view" id="view-library" hidden></section>
    <section class="view" id="view-usage" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
