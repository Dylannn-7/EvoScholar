id: optica
name: Optica Publishing Group（Optica、Optics Express、Optics Letters 等）
sources:
  - url: https://opg.optica.org/content/author/portal/item/style-optica-styleguide/
    checked: 2026-11-18
notes: >-
  指南没有给出图内最小字号和分辨率。版心宽度按指南的 Word 版式推算：US Letter 8.5 in 减去左右各 1.625 in 页边距 = 5.25 in。
  宽度不超过 2.6 in（6.6 cm）的小图可以并排放。
width_mm: { single: 133.4, half: 66 }
max_height_mm: null
font: { family: null, min_pt: null, max_pt: null, editable: null }
caption_pt: 8
panel_label: { style: parenthesized }
raster_min_dpi: null
line_art_min_dpi: null
formats: { preferred: null, vector: null }
color:
  space: null
  colorblind_safe: true
  not_color_only: true      # 不能只靠颜色区分元素：配合线型、标记或文字标注
  palette: null
axes: { units_required: null, gridlines: null }
